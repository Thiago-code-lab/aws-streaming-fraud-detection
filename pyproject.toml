[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-streaming-fraud-detection"
version = "0.2.0"
description = "Pipeline educacional de Engenharia de Dados na AWS para detecção de fraudes com modos local e AWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.34",
  "pandas>=2.2",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fraud_detection"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fraud_detection"]

[[tool.mypy.overrides]]
module = ["boto3", "pandas", "pyarrow"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
